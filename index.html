        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Store",
                "name": "Premium Products Store",
                "url": "https://fake-store-products.vercel.app/",
                "logo": "https://fake-store-products.vercel.app/icons/favicon-32x32.png",
                "description": "Premium online store offering high-quality products across electronics, clothing, jewelry, and home goods categories.",
                "currenciesAccepted": "USD",
                "paymentAccepted": "Credit Card",
                "priceRange": "$$",
                "sameAs": ["https://github.com/gabrielatwell1987/e-commerce"]
            }
        </script>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "Premium Products Store",
                "url": "https://fake-store-products.vercel.app/",
                "description": "Discover our curated collection of high-quality products including electronics, clothing, jewelry, and home goods.",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": {
                        "@type": "EntryPoint",
                        "urlTemplate": "https://fake-store-products.vercel.app/?q={search_term_string}"
                    },
                    "query-input": "required name=search_term_string"
                }
            }
        </script>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "MerchantReturnPolicy",
                "applicableCountry": "US",
                "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
                "merchantReturnDays": 30,
                "returnMethod": "https://schema.org/ReturnByMail",
                "returnFees": "https://schema.org/FreeReturn"
            }
        </script>
        <style>
            .loading-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            .loading-container.hidden {
                display: none;
            }

            .spinner {
                width: 5rem;
                height: 5rem;
                border: 10px solid #cfcfcf;
                border-top: 0.7rem solid hsl(236, 100%, 23%);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            .main-content {
                opacity: 0;
                transition: opacity 0.3s ease-in;
            }

            .main-content.visible {
                opacity: 1;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <noscript>
            <div
                style="
                    padding: 2rem;
                    text-align: center;
                    font-family: sans-serif;
                "
            >
                <h1>Premium Products Store</h1>
                <p>
                    Discover our curated collection of high-quality products
                    including electronics, clothing, jewelry, and home goods.
                    Fast shipping, secure checkout, and excellent customer
                    service.
                </p>
                <p>
                    Please enable JavaScript to browse our full catalog of
                    premium products and complete your purchase.
                </p>
            </div>
        </noscript>

        <div
            id="loading-container"
            class="loading-container"
            aria-label="Loading products"
        >
            <div class="spinner"></div>
        </div>

        <a href="#main-content" class="skip-link">Skip to main content</a>

        <div id="main-content" class="main-content">
            <div class="container">
                <header role="banner">
                    <h1 class="title">Premium Products</h1>
                    <nav role="navigation" aria-label="Shopping cart">
                        <button
                            class="cart-icon"
                            aria-label="Open shopping cart"
                            aria-describedby="cart-count-header"
                        >
                            🛒
                            <span id="cart-count-header" aria-live="polite"
                                >0</span
                            >
                        </button>
                    </nav>
                </header>

                <main role="main" id="main">
                    <section class="cart-status" aria-live="polite">
                        <p>
                            Items in cart:
                            <span id="cart-count-paragraph">0</span>
                        </p>
                    </section>

                    <section
                        class="products-section"
                        aria-labelledby="products-heading"
                    >
                        <h2 id="products-heading" class="visually-hidden">
                            Our Products
                        </h2>
                        <div
                            id="products-grid"
                            role="grid"
                            aria-label="Product catalog"
                        ></div>
                    </section>
                </main>
            </div>

            <div
                id="cart-modal"
                class="modal"
                role="dialog"
                aria-labelledby="cart-modal-title"
                aria-hidden="true"
            >
                <div class="modal-content" role="document">
                    <button
                        class="close"
                        aria-label="Close shopping cart"
                        title="Close"
                    >
                        &times;
                    </button>

                    <h2 id="cart-modal-title" class="modal-title">
                        Shopping Cart
                    </h2>

                    <div
                        class="cart-modal-body"
                        role="region"
                        aria-live="polite"
                    ></div>

                    <div class="cart-total-section">
                        <h3>Total: $<span id="cart-total">0</span></h3>
                    </div>

                    <section
                        class="payment-section"
                        aria-labelledby="payment-heading"
                    >
                        <h2 id="payment-heading">Payment Details</h2>

                        <form id="payment-form" role="form" novalidate>
                            <div class="form-group">
                                <label for="card-name">Name on Card</label>
                                <input
                                    type="text"
                                    id="card-name"
                                    name="cardName"
                                    required
                                    autocomplete="cc-name"
                                    aria-describedby="card-name-error"
                                />
                                <div
                                    id="card-name-error"
                                    class="error-message"
                                    role="alert"
                                ></div>
                            </div>

                            <div class="form-group">
                                <label for="card-number">Card Number</label>
                                <input
                                    type="text"
                                    id="card-number"
                                    name="cardNumber"
                                    required
                                    autocomplete="cc-number"
                                    inputmode="numeric"
                                    pattern="[0-9\s]{13,19}"
                                    aria-describedby="card-number-error"
                                />
                                <div
                                    id="card-number-error"
                                    class="error-message"
                                    role="alert"
                                ></div>
                            </div>

                            <div class="one-line">
                                <div class="form-group">
                                    <label for="expiry-date"
                                        >Expiration Date</label
                                    >
                                    <input
                                        type="text"
                                        id="expiry-date"
                                        name="expiryDate"
                                        required
                                        autocomplete="cc-exp"
                                        placeholder="MM/YY"
                                        pattern="(0[1-9]|1[0-2])\/([0-9]{2})"
                                        aria-describedby="expiry-error"
                                    />
                                    <div
                                        id="expiry-error"
                                        class="error-message"
                                        role="alert"
                                    ></div>
                                </div>

                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input
                                        type="text"
                                        id="cvv"
                                        name="cvv"
                                        required
                                        autocomplete="cc-csc"
                                        inputmode="numeric"
                                        pattern="[0-9]{3,4}"
                                        maxlength="4"
                                        aria-describedby="cvv-error"
                                    />
                                    <div
                                        id="cvv-error"
                                        class="error-message"
                                        role="alert"
                                    ></div>
                                </div>
                            </div>

                            <button
                                id="checkout-button"
                                type="submit"
                                aria-describedby="total-amount"
                            >
                                Pay Now
                            </button>
                        </form>
                    </section>
                </div>
            </div>

            <footer role="contentinfo">
                <nav aria-label="Social media links">
                    <a
                        href="https://github.com/gabeatwell/e-commerce"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="View project source code on GitHub"
                    >
                        <span class="gh"
                            ><i
                                class="fa-brands fa-github"
                                aria-hidden="true"
                            ></i
                        ></span>
                    </a>
                </nav>
            </footer>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
